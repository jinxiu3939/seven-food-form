<input
  nbInput
  fullWidth
  [type]="model.getInputType()"
  [placeholder]="model.placeholder"
  [fieldSize]="model.fieldSize"
  [shape]="model.shape"
  [formControl]="control"
  [disabled]="model.disabled"
  [attr.maxlength]="model.maxLength"
  [attr.minlength]="model.minLength"
  [attr.pattern]="model.pattern">
